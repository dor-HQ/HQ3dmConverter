name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore HQ3dmConverter.sln

      - name: Build
        run: dotnet build HQ3dmConverter.sln -c Release --no-restore

      - name: Test
        run: dotnet test HQ3dmConverter.sln -c Release --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test_results.trx"

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore HQ3dmConverter.sln

      - name: Build
        run: dotnet build HQ3dmConverter.sln -c Release --no-restore

      - name: Publish CLI
        run: |
          dotnet publish src/HQ3dmConverter.Cli/HQ3dmConverter.Cli.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o dist/cli

      - name: Publish WPF
        run: |
          dotnet publish src/HQ3dmConverter.Wpf/HQ3dmConverter.Wpf.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o dist/wpf

      - name: Copy READMEs
        run: |
          Copy-Item src/HQ3dmConverter.Cli/README.md dist/cli/
          Copy-Item src/HQ3dmConverter.Wpf/README.md dist/wpf/

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HQ3dmConverter-CLI
          path: dist/cli/

      - name: Upload WPF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HQ3dmConverter-WPF
          path: dist/wpf/